<div class="modal-header">
  <h4 class="modal-title pull-left">Новая локация</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="cancel()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<form name="locationForm" #locationForm="ngForm" novalidate>
  <div class="modal-body text-center">
    <div class="row mb-1">
      <label for="address" class="form-label col-sm-4">Город</label>
      <div class="col-sm-8">
        <settlement-select [settlementId]="newLocation.settlementId"
                           (settlementChanged)="onSettlementChange($event)"></settlement-select>
      </div>
    </div>
    <div class="row mb-1">
      <label for="address" class="form-label col-sm-4">Адрес</label>
      <div class="col-sm-8">
        <input type="text" id="address" name="address" #address="ngModel" [(ngModel)]="newLocation.address"
               class="form-control form-control-sm" required>
      </div>
    </div>
    <div class="row mb-1">
      <label for="coords" class="form-label col-sm-4">coordinates</label>
      <div class="col-sm-4" id="coords">
        <input type="text" id="lon" name="lon" #lon="ngModel" [(ngModel)]="newLocation.lon"
               class="form-control form-control-sm" required>
      </div>
      <div class="col-sm-4">
        <input type="text" id="lat" name="lat" #lat="ngModel" [(ngModel)]="newLocation.lat"
               class="form-control form-control-sm" required>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="save()" [disabled]="locationForm.invalid">
      Добавить
    </button>
    <button type="button" class="btn btn-outline-danger" (click)="cancel()">
      Отмена
    </button>
  </div>
</form>
