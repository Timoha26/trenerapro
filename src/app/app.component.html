<header>
  <div class="container header-inner">
    <div class="logo" routerLink="/">
      <img class="" src="{{logoUrl}}" alt="TrainerPRO">
      <div>
        Тренер<span class="primary">PRO</span>
        <span>Лучший тренер для вашего ребенка</span>
      </div>
    </div>
    <nav class="nav-links">
      <a routerLink="/categories" routerLinkActive="active">Категории</a>
      <a routerLink="/trainers" routerLinkActive="active">Тренеры</a>
      <a routerLink="/clubs" routerLinkActive="active">Клубы</a>
      <a routerLink="/admin" routerLinkActive="active" *ngIf="isLogged()">Админка</a>
    </nav>
    <div class="user-actions">
      <div class="location-select" (click)="selectCity()">
        <i class="fas fa-map-marker-alt"></i>
        <span>{{ currentSettlement?.settlement }}</span>
        <i class="fas fa-chevron-down" style="font-size: 10px;"></i>
      </div>
      <div class="user-avatar"><i class="fas fa-user"></i></div>
      <a class="login-btn" *ngIf="!isLogged()" (click)="loginModal()">Войти</a>
      <a class="login-btn" *ngIf="isLogged()" (click)="logout()">Выйти</a>
    </div>
  </div>
</header>

<router-outlet></router-outlet>

<footer>
  <div class="container footer-inner">
    <div class="logo" style="color: white;">
      <img class="" src="{{logoUrl}}" alt="TrainerPRO">
      <div>
        Тренер<span class="primary">PRO</span>
        <span style="color: #9CA3AF;">Сервис поиска тренеров</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat-item"><i class="fas fa-users"></i> 1500+ тренеров</div>
      <div class="stat-item"><i class="fas fa-map-marker-alt"></i> 400+ клубов</div>
      <div class="stat-item"><i class="fas fa-medal"></i> 50+ видов спорта</div>
      <div class="stat-item"><i class="fas fa-star"></i> 25 000+ довольных детей</div>
    </div>
  </div>
</footer>
