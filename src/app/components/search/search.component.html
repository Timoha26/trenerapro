<main class="container">
  <div class="page-header">
    <h1>Поиск</h1>
  </div>

  <search-sort [searchText]="searchText"></search-sort>

  <div class="content-grid details-grid">
    <section>
      <div class="search-card" *ngFor="let item of searchResult">
        <a routerLink="{{getLink(item)}}">
          {{ item.entityType | entityType }} {{ item.entityTitle }}
          <em class="fas fa-angle-right fa-pull-right"></em>
        </a>
      </div>
    </section>

    <rightSidebar></rightSidebar>
  </div>
</main>
