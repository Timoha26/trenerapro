<section class="sports container">
  <div class="section-title">
    <h2>Категории</h2>
    <div class="btn-group">
      <button type="button" class="btn-outline" routerLink="/categories">
        Смотреть все
      </button>
    </div>
  </div>
  <div *ngIf="chainCategories.length < 2">
    <div *ngFor="let section of viewCategories" style="margin-bottom:20px;">
      <nav>
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            {{ section.name }}
          </li>
        </ol>
      </nav>
      <div class="landing-sports-grid" appResizeTracker (isSmallScreen)="onResize($event)">
        <div class="sport-card" *ngFor="let subCategory of section.subCategories" (click)="goToPageByCategory(subCategory)">
          <div class="sport-card__img-wrap">
            <div class="sport-card__card-fav"
                 *ngIf="!subCategory.subCategories || subCategory.subCategories.length < 1">
              <i class="far fa-share-square"></i>
            </div>
            <img src="{{subCategory.imageUrl}}" alt="{{ subCategory.name }}" class="sport-card__image">
          </div>
          <div class="sport-card__content">
            <p class="sport-card__text">{{ subCategory.name }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="chainCategories.length > 1">
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item" *ngFor="let category of chainCategories">
          <a href="#" (click)="$event.preventDefault(); goToPageByChain(category)" *ngIf="!isLastChainCategory(category.id ?? 0, chainCategories)">{{ category.name }}</a>
          <span *ngIf="isLastChainCategory(category.id ?? 0, chainCategories)">{{ category.name }}</span>
        </li>
      </ol>
    </nav>
    <div class="landing-sports-grid" appResizeTracker (isSmallScreen)="onResize($event)">
      <div class="sport-card" *ngFor="let category of displayedCategories" (click)="goToPageByCategory(category)">
        <div class="sport-card__img-wrap">
          <div class="sport-card__card-fav" *ngIf="!category.subCategories || category.subCategories.length < 1">
            <i class="far fa-share-square"></i>
          </div>
          <img src="{{category.imageUrl}}" alt="{{ category.name }}" class="sport-card__image">
        </div>
        <div class="sport-card__content">
          <p class="sport-card__text">{{ category.name }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
