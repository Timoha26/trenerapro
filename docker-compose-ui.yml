version: '3.8'

services:
  ui-app:
    image: timoha26/trenerapro
    container_name: trainerpro-ui
    restart: always
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      # Указываем основной домен
      - "traefik.http.routers.ui.rule=Host(`trenerpro.site`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls=true"
      # Внутренний порт контейнера UI (например, 80 или 3000)
      - "traefik.http.services.ui.loadbalancer.server.port=80"
      # Приоритет ниже, чем у API, чтобы API обрабатывался в первую очередь
      - "traefik.http.routers.ui.priority=1"

networks:
  traefik-public:
    external: true
