<main>
  <!-- Hero -->
  <section class="hero container">
    <div class="container">
      <div class="hero-content">
        <h1>Начни свой путь с <span class="text-gold">ТренерPRO</span></h1>
        <p>Успей разместить бесплатно свою анкету на ТренерPRO до 20.02.2027 года.</p>
        <form class="search-form">
          <div class="search-group">
            <input type="text" id="search" name="search" #search="ngModel" [(ngModel)]="searchText" (keydown.enter)="onSearch()" placeholder="Спорт\тренер\клуб?">
          </div>
          <button type="button" class="btn-primary search-btn" (click)="onSearch()">
            <em class="fas fa-search"></em>
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <categories></categories>

  <!-- Trainers -->
  <landing-trainers-home></landing-trainers-home>

  <!-- Why Us -->
  <landing-whyus-home></landing-whyus-home>

  <!-- Clubs -->
  <landing-clubs-home></landing-clubs-home>

  <!-- Reviews -->
  <landing-reviews-home></landing-reviews-home>

  <!-- Become Trainer CTA -->
  <section class="container">
    <div class="become-trainer">
      <div class="become-content">
        <h2>Станьте тренером на ТренерPRO</h2>
        <p>Начните зарабатывать на своих знаниях и опыте! Заполните анкету и находите клиентов рядом с домом.</p>
      </div>
      <div class="become-actions">
        <button class="btn-primary" routerLink="/questionnaire">Заполнить анкету</button>
        <button class="btn-outline" style="border-color: white; color: white;" routerLink="/about">Узнать больше</button>
      </div>
    </div>
  </section>
</main>
