<div class="input-group">
  <input type="text" id="settlement" name="settlement" #settlement="ngModel"
         [(ngModel)]="selectedSettlement"
         [typeahead]="settlements"
         typeaheadOptionField="settlement"
         typeaheadGroupField="region"
         [typeaheadMinLength]="0"
         [typeaheadScrollable]="true"
         [typeaheadOptionsInScrollableView]="8"
         (typeaheadOnSelect)="onSelect($event)"
         placeholder="начните ввод для поиска"
         autocomplete="off"
         class="form-control form-control-sm">
  <!--  <button type="button" class="btn btn-outline-success btn-sm" (click)="addSettlement()" title="Добавить локацию">-->
  <!--    <em class="fa fa-plus"></em>-->
  <!--  </button>-->
</div>
